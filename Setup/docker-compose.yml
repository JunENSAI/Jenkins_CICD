version: '3.8'

services:
  # Service 1: Jenkinns
  jenkins:
    build: .
    container_name: Setup
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - ci-network
    depends_on:
      - postgres

  # Service 2: PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user_name
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432" # Exposed so DBeaver can connect from your host
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist DB data
    networks:
      - ci-network

volumes:
  jenkins_home:
  postgres_data:

networks:
  ci-network: